# CasaOS: App Store > Custom Install > Import, paste this file, then set the
# environment values in the CasaOS form. docker compose CLI: copy .env.example to .env.
name: assignpad
services:
  assignpad:
    image: ghcr.io/daviied/assignpad:latest
    container_name: assignpad
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Password for this app (8+ characters).
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
      # Your Cengage login. The server logs in to WebAssign with it.
      CENGAGE_EMAIL: ${CENGAGE_EMAIL:-}
      CENGAGE_PASSWORD: ${CENGAGE_PASSWORD:-}
      # auto = Secure cookie on HTTPS, plain cookie on LAN http.
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
    volumes:
      - /DATA/AppData/assignpad:/data
    shm_size: "512mb"
    x-casaos:
      title:
        en_us: AssignPad
      description:
        en_us: Fast WebAssign front end with a Desmos-style math editor.
      icon: https://raw.githubusercontent.com/daviied/assignpad/main/public/icon-512.png
      port_map: "8080"
      scheme: http
      index: /
