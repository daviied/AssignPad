# Paste into CasaOS: App Store > Custom Install > Import (docker compose).
# Change YOUR_GITHUB_USER and APP_PASSWORD before you install.
name: assignpad
services:
  assignpad:
    image: ghcr.io/YOUR_GITHUB_USER/assignpad:latest
    container_name: assignpad
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PASSWORD: "change-me-to-a-long-password"
      # auto = Secure cookie on HTTPS, works on plain http on your LAN too.
      COOKIE_SECURE: "auto"
      # Optional fallback: server logs in to Cengage itself when the session expires.
      # CENGAGE_EMAIL: ""
      # CENGAGE_PASSWORD: ""
    volumes:
      - /DATA/AppData/assignpad:/data
    shm_size: "512mb"
    x-casaos:
      title:
        en_us: AssignPad
      description:
        en_us: Fast WebAssign front end with a Desmos-style math editor.
      icon: https://raw.githubusercontent.com/YOUR_GITHUB_USER/assignpad/main/public/icon-512.png
      port_map: "8080"
      scheme: http
      index: /
